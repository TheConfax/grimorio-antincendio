<!DOCTYPE html>
<html lang="it">
<head>

<title>Quiz del Grimorio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: serio e chiaro, è l'allenamento per un esame vero; la grafica è quella del grimorio
   IDEA: le pagine d'esame del grimorio: pergamena, etichette appuntate, inchiostro e muschio
   PICTURE: il quiz stesso, la domanda come una pagina del libro e le risposte come etichette
   COLOUR and TYPE: muschio, fungo, ambra candela, rosa antico, lilla su pergamena; IM Fell + Caveat + Nunito
   LAYOUT: copertina con le tre prove, poi i capitoli; durante il quiz una sola colonna calma */
:root{color-scheme:light dark;
--bg:light-dark(#efe5cf,#171c15);--page:light-dark(#f7efdc,#1f261c);--card:light-dark(#fffaf0,#262f21);--ink:light-dark(#2e251a,#ece2cc);--mute:light-dark(#6b5a44,#b8ab92);
--moss:light-dark(#4d6a35,#93b56e);--fungo:light-dark(#7b4f30,#d39b6c);--amber:light-dark(#b8741a,#f2b54f);--rose:light-dark(#b0676e,#e4a4aa);--lilac:light-dark(#7e6fa8,#b8a9e0);
--line:light-dark(#d8c9a8,#3b4532);--wash:light-dark(#efe2c2,#2a3323);
--grn:var(--moss);--grnbg:light-dark(#e3ead2,#26331f);--red2:light-dark(#a24a3a,#e98a74);--redbg:light-dark(#f6e0d6,#3a2620)}
html{scrollbar-gutter:stable}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;
background-image:radial-gradient(circle at 12% 8%,light-dark(#e6d6b0,#222b1d) 0 18%,transparent 40%),radial-gradient(circle at 90% 60%,light-dark(#e9dcc0,#1b2318) 0 15%,transparent 35%)}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
.top{padding:clamp(26px,5vw,52px) max(5vw,16px) 8px;text-align:center}
.qbar{position:fixed;top:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 8px 20px -16px #0008}
.qbar .in{position:relative;max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px;min-height:56px}
.qbar .timer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:17px;padding:8px 16px}
.qbar .timer[hidden]{display:none}
.tog,.mq{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:99px;font:700 16px/1 Nunito,system-ui,sans-serif;text-decoration:none;white-space:nowrap}
.tog{background:var(--fungo);color:var(--page);border:1px solid var(--fungo);font-weight:800}
.tog .ch{font-size:22px;line-height:1;margin-top:-3px}
.mq{margin-left:auto;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.mq svg{width:16px;height:14px;flex:none}
.tog:hover,.mq:hover{filter:brightness(1.05)}
.tog[hidden],.mq[hidden]{display:none}
body{padding-top:57px}
.rwrap{position:relative;display:table;margin:36px auto 0}
.reset{display:block;min-height:44px;padding:0 18px;background:light-dark(#b8392b,#c9483a);color:#fff;border:0;border-radius:99px;font:700 14px Nunito,system-ui,sans-serif}
.reset:hover{filter:brightness(1.07)}
.frog{position:absolute;top:-22px;right:-26px;width:44px;height:34px;transform:rotate(12deg);cursor:default;user-select:none}
.top .hand{font:700 26px Caveat,cursive;color:var(--moss);margin:0}
.top h1{font-size:clamp(40px,8vw,64px);margin:4px 0 8px}
.top p{margin:0 auto;max-width:58ch;color:var(--mute)}
.vine.sep{margin:6px auto 26px}
.vine.sep.end{margin:36px auto 0}
.vine{display:block;width:min(100%,560px);height:26px;margin:14px auto 0;color:var(--moss)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px;text-align:left}
.mode{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 18px;min-height:0;text-align:left;box-shadow:0 6px 0 -2px light-dark(#d8c9a8,#0d110b),0 12px 22px -16px light-dark(#7b5c33,#000);transition:transform .08s,box-shadow .08s}
.mode .go{flex:none;font:800 26px/1 Nunito,system-ui,sans-serif;color:var(--fungo);margin-top:-3px}
.mode:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 -2px light-dark(#d8c9a8,#0d110b),0 6px 12px -10px light-dark(#7b5c33,#000)}
.mode .deco{position:absolute;pointer-events:none}
.mode .frogh{width:46px;height:35px;top:-20px;left:-14px;transform:rotate(-12deg)}
.mode .shroom{width:34px;height:37px;top:-20px;right:-10px;transform:rotate(10deg)}
.mode .snail{width:54px;height:38px;bottom:-16px;right:-10px}
.mode b{display:block;font:400 25px/1.1 "IM Fell English",serif}
.mode span{font-size:14px;color:var(--mute)}
.mode.exam{background:var(--wash);border-color:var(--fungo)}
.mode:hover:not(:disabled){border-color:var(--moss)}
.mode:disabled{opacity:.55;cursor:default}
.band{padding:clamp(20px,3vw,36px) max(5vw,16px) 56px}
.stats{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:22px}
.stats .bar{height:14px;border-radius:7px}
.stats small{display:block;margin-top:6px;color:var(--mute);font-size:13px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.chap{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;min-height:72px}
.chap:hover{border-color:var(--moss)}
.chap .num{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--moss);color:var(--page);display:grid;place-items:center;font:800 18px Nunito}
.chap .nm{font-weight:700;line-height:1.25}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--moss)}.bar .ko{background:var(--red2)}
.chap small{color:var(--mute);font-size:13px}
h2.sec{font-size:32px;margin-bottom:14px;text-align:center}
#quiz{display:none}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 auto 14px;max-width:780px}
.qhead .ttl{font:400 26px "IM Fell English",serif;flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;white-space:nowrap}
.pill.timer{background:var(--ink);color:var(--page);font-variant-numeric:tabular-nums}
.pill.timer.low{background:var(--red2);color:#fff}
.exit{background:none;border:1px solid var(--line);border-radius:99px;padding:8px 16px;min-height:44px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 auto 22px;max-width:780px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--amber));transition:width .3s}
.qcard{background:var(--page);border:1px solid var(--line);border-radius:4px 4px 10px 10px;padding:clamp(20px,3.5vw,34px);max-width:780px;margin:0 auto;box-shadow:0 18px 40px -26px light-dark(#7b5c33,#000)}
.qn{display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 21px/1.1 Caveat,cursive;color:var(--lilac)}
.lvl{flex:none;font:800 12px/1 Nunito,system-ui,sans-serif;padding:5px 9px;border-radius:5px;letter-spacing:.02em}
.lvl.new{background:light-dark(#e7e6e3,#2e302e);color:light-dark(#62605c,#b9b8b4);border:1px solid light-dark(#a9a7a2,#5f615e)}
.lvl.easy{background:var(--grnbg);color:var(--moss);border:1px solid var(--moss)}
.lvl.mid{background:light-dark(#f8e7c4,#3a2f17);color:light-dark(#8a5410,#f2b54f);border:1px solid var(--amber)}
.lvl.hard{background:var(--redbg);color:var(--red2);border:1px solid var(--red2)}
.qt{font-size:clamp(19px,2.4vw,22px);font-weight:700;line-height:1.4;margin:6px 0 16px}
.qimg{display:block;width:120px;height:120px;object-fit:contain;margin:0 0 16px;background:#fff;border-radius:6px;padding:6px;border:1px solid var(--line);transform:rotate(-2deg);box-shadow:0 6px 14px -8px #0007}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;min-height:56px;line-height:1.45}
.opt .l{width:34px;height:34px;border-radius:50%;background:var(--wash);color:var(--fungo);border:1.5px solid var(--fungo);display:grid;place-items:center;font:400 19px "IM Fell English SC",serif}
.opt:hover:not(:disabled){border-color:var(--moss)}
.opt.sel{border-color:var(--fungo);box-shadow:inset 0 0 0 1px var(--fungo)}.opt.sel .l{background:var(--fungo);color:var(--page)}
.opt.right{border-color:var(--grn);background:var(--grnbg)}.opt.right .l{background:var(--grn);border-color:var(--grn);color:var(--page)}
.opt.wrong{border-color:var(--red2);background:var(--redbg)}.opt.wrong .l{background:var(--red2);border-color:var(--red2);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;display:none;border:1px dashed var(--line)}
.fb.show{display:block}
.fb.good{background:var(--grnbg);border-color:var(--moss)}.fb.bad{background:var(--redbg);border-color:var(--red2)}
.fb b{font:400 23px "IM Fell English",serif}
.fb p{margin:4px 0 0}
.fb .tip{font:700 21px/1.25 Caveat,cursive;color:var(--fungo)}
.fb a{color:var(--fungo);font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px auto 0;max-width:780px}
.qnav{justify-content:space-between;flex-wrap:nowrap}
.qnav{align-items:center}
#bHome,#bAgain{display:inline-flex;align-items:center;gap:8px}
#bAgain .ri{width:15px;height:15px;flex:none}
#bHome .xi{width:11px;height:11px;flex:none}
.qnav [hidden-slot]{visibility:hidden}
.qnav .ask{font-weight:800;font-size:17px}
.qnav #bYes,.qnav #bNo{min-width:96px;justify-content:center}
.btn.yes{background:var(--fungo);color:var(--page)}
@media(max-width:600px){.qnav,.rnav{gap:6px}.qnav .btn,.rnav .btn{padding:12px 12px;white-space:nowrap;font-size:15px}}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.rnav{margin:0 0 18px;justify-content:space-between;flex-wrap:nowrap}
.rnav #bAgain{margin-left:auto}
.btn{border:0;border-radius:99px;padding:12px 24px;min-height:48px;font-weight:800;background:var(--fungo);color:var(--page)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:18px auto 0;max-width:780px}
.dot{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.dot.done{background:var(--moss);color:var(--page);border-color:var(--moss)}.dot.cur{outline:3px solid var(--amber)}
.res{max-width:780px;margin:0 auto}
.score{position:relative;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:22px 24px;border-radius:10px;margin-bottom:22px;border:2px solid}
.score.pass{background:var(--grnbg);border-color:var(--moss)}.score.mid{background:light-dark(#f8e7c4,#3a2f17);border-color:var(--amber)}.score.fail{background:var(--redbg);border-color:var(--red2)}
.score .big{font:800 clamp(52px,10vw,76px)/1 Nunito;color:var(--fungo)}
.score h2{font-size:clamp(28px,4vw,38px)}
.party{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.party i{position:absolute;top:-34px;display:block;opacity:0;animation-name:fall;animation-timing-function:cubic-bezier(.3,.2,.6,1);animation-fill-mode:forwards}
.party svg{display:block;width:100%;height:100%}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),108vh) rotate(var(--r));opacity:0}}
.pfrog{position:absolute;right:16px;top:-30px;width:62px;height:47px;pointer-events:none;animation:hop .6s ease-out both}
.pfrog.big{animation:hop .6s ease-out both,jump .5s ease-in-out .6s 3}
.pfrog.still{animation:none}
@keyframes hop{0%{transform:translateY(18px) scale(.5);opacity:0}45%{transform:translateY(-14px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes jump{0%,100%{transform:none}50%{transform:translateY(-20px) rotate(-6deg)}}
.rv{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.rv.bad{border-left:6px solid var(--red2)}.rv.good{border-left:6px solid var(--moss)}
.rv .rvn{font:700 21px/1.1 Caveat,cursive;color:var(--lilac);margin-bottom:4px}
.rip{display:inline-block;margin:0 0 18px;padding:6px 0;color:var(--fungo);font-weight:800;font-size:16px;text-decoration:none}
.rip:hover{text-decoration:underline}
.rv .q{font-weight:700}
.rv .a{margin-top:6px;font-size:15px}
.rv .a em{font-style:normal;color:var(--moss);font-weight:700}
.rv .a s{color:var(--red2)}
.empty{color:var(--mute)}
body.inquiz .top{padding-block:16px 4px}body.inquiz .top p,body.inquiz .modes,body.inquiz .top .hand,body.inquiz .vine{display:none}body.inquiz .top h1{font-size:clamp(26px,4vw,34px)}
@media(max-width:600px){.qhead .ttl{flex-basis:100%}.modes{grid-template-columns:1fr;gap:30px}.mode{min-height:0}.mode .snail{bottom:-11px}.mode .shroom{top:-15px}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<nav class="qbar" aria-label="Navigazione"><div class="in"><a class="tog" id="back" href="../"><span class="ch" aria-hidden="true">&lsaquo;</span>Grimorio</a><span class="pill timer" id="tmr" hidden>30:00</span></div></nav>
<header class="top"><div class="wrap">
    <p class="hand">le prove del Grimorio del Fuoco</p>
  <h1>Quiz Antincendio</h1>
  <p>Le <b>345 domande</b> ufficiali, divise negli stessi capitoli del Grimorio.<br>Per passare ne servono <b>10 giuste</b> su 15 in <b>30 minuti</b>.</p>
  <svg class="vine" viewBox="0 0 700 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14c60-14 110 14 170 0s110-14 170 0 110 14 170 0 110-14 190 0" stroke="currentColor" stroke-width="2" fill="none"/><g fill="currentColor"><ellipse cx="90" cy="8" rx="9" ry="4" transform="rotate(-25 90 8)"/><ellipse cx="260" cy="20" rx="9" ry="4" transform="rotate(25 260 20)"/><ellipse cx="430" cy="8" rx="9" ry="4" transform="rotate(-25 430 8)"/><ellipse cx="600" cy="20" rx="9" ry="4" transform="rotate(25 600 20)"/></g></svg>

    <button class="mode" id="bErr"><b>Ripasso degli errori</b><span class="go" aria-hidden="true">&rsaquo;</span><svg class="deco snail" viewBox="0 0 80 56" aria-hidden="true"><circle cx="64" cy="8" r="2" fill="#b8a9e0"/><circle cx="70" cy="3" r="2.8" fill="#b8a9e0"/><path d="M6 48c10 2 46 2 62-1 4-1 6-4 5-8-1-5-5-6-8-6" fill="#d9b48a" stroke="#6b4a2b" stroke-width="2" stroke-linejoin="round"/><path d="M60 34l-1-14M66 34l3-13" stroke="#6b4a2b" stroke-width="2" stroke-linecap="round"/><circle cx="59" cy="19" r="3.2" fill="#fff" stroke="#6b4a2b" stroke-width="1.6"/><circle cx="69" cy="20" r="3.2" fill="#fff" stroke="#6b4a2b" stroke-width="1.6"/><circle cx="59.6" cy="17.8" r="1.5" fill="#2b2118"/><circle cx="69.6" cy="18.8" r="1.5" fill="#2b2118"/><path d="M66 41h4" stroke="#6b4a2b" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="30" r="17" fill="#c58a4d" stroke="#6b4a2b" stroke-width="2"/><path d="M32 30a4 4 0 1 1 4 4 8 8 0 1 1-8-8 12 12 0 1 1 12 12" fill="none" stroke="#6b4a2b" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="mode" id="bAll"><b>Modalità bombeiro</b><span class="go" aria-hidden="true">&rsaquo;</span><svg class="deco shroom" viewBox="0 0 48 52" aria-hidden="true"><path d="M15 28c-1 8-2 14 0 19 3 3 15 3 18 0 2-5 1-11 0-19z" fill="#f3e6cc" stroke="#6b4a2b" stroke-width="2" stroke-linejoin="round"/><path d="M3 27C3 13 13 4 24 4s21 9 21 23c0 3-3 4-6 4H9c-3 0-6-1-6-4z" fill="#c4473a" stroke="#6b2a22" stroke-width="2" stroke-linejoin="round"/><circle cx="14" cy="15" r="3.4" fill="#fff6e6"/><circle cx="28" cy="10" r="2.6" fill="#fff6e6"/><circle cx="36" cy="20" r="3" fill="#fff6e6"/><circle cx="22" cy="22" r="2" fill="#fff6e6"/><circle cx="19" cy="38" r="3" fill="#fff" stroke="#2b2118" stroke-width="1.2"/><circle cx="29" cy="38" r="3" fill="#fff" stroke="#2b2118" stroke-width="1.2"/><circle cx="19.6" cy="38.4" r="1.6" fill="#2b2118"/><circle cx="29.6" cy="38.4" r="1.6" fill="#2b2118"/><path d="M22 44c1.2 1 2.8 1 4 0" stroke="#6b4a2b" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
  </div>
</div></header>

<main class="band"><div class="wrap">
  <section id="home">
    <div class="stats" id="stats"></div>
    <svg class="vine sep" viewBox="0 0 700 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14c60-14 110 14 170 0s110-14 170 0 110 14 170 0 110-14 190 0" stroke="currentColor" stroke-width="2" fill="none"/><g fill="currentColor"><ellipse cx="90" cy="8" rx="9" ry="4" transform="rotate(-25 90 8)"/><ellipse cx="260" cy="20" rx="9" ry="4" transform="rotate(25 260 20)"/><ellipse cx="430" cy="8" rx="9" ry="4" transform="rotate(-25 430 8)"/><ellipse cx="600" cy="20" rx="9" ry="4" transform="rotate(25 600 20)"/></g></svg>
    <h2 class="sec">Quiz Flash</h2>
    <div class="chaps" id="chaps"></div>
    <svg class="vine sep end" viewBox="0 0 700 28" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14c60-14 110 14 170 0s110-14 170 0 110 14 170 0 110-14 190 0" stroke="currentColor" stroke-width="2" fill="none"/><g fill="currentColor"><ellipse cx="90" cy="8" rx="9" ry="4" transform="rotate(-25 90 8)"/><ellipse cx="260" cy="20" rx="9" ry="4" transform="rotate(25 260 20)"/><ellipse cx="430" cy="8" rx="9" ry="4" transform="rotate(-25 430 8)"/><ellipse cx="600" cy="20" rx="9" ry="4" transform="rotate(25 600 20)"/></g></svg>
    <div class="rwrap"><button class="reset" id="bReset"><span id="bResetT">Cancella tutti i dati</span></button><svg class="frog" viewBox="0 0 74 56" aria-hidden="true"><ellipse cx="37" cy="38" rx="30" ry="16" fill="#7fae5a" stroke="#2f4a1f" stroke-width="2"/><circle cx="22" cy="20" r="11" fill="#7fae5a" stroke="#2f4a1f" stroke-width="2"/><circle cx="52" cy="20" r="11" fill="#7fae5a" stroke="#2f4a1f" stroke-width="2"/><circle cx="22" cy="21" r="6" fill="#fff"/><circle cx="52" cy="21" r="6" fill="#fff"/><circle cx="22" cy="23" r="3.2" fill="#2b2118"/><circle cx="52" cy="23" r="3.2" fill="#2b2118"/><path d="M13 15l12-6M61 15l-12-6" stroke="#2f4a1f" stroke-width="2.4" stroke-linecap="round"/><path d="M26 44c6-6 16-6 22 0" stroke="#2f4a1f" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M17 30c0 4-3 6-3 8a3 3 0 006 0c0-2-3-4-3-8z" fill="#8fd0f0"/><ellipse cx="14" cy="41" rx="4" ry="2.5" fill="#e9a3a3" opacity=".7"/><ellipse cx="60" cy="41" rx="4" ry="2.5" fill="#e9a3a3" opacity=".7"/></svg></div>
  </section>
  <section id="quiz"></section>
</div></main>

<script>
{
const CH={"1": "Il sigillo del fuoco", "2": "Le cinque creature del fuoco", "3": "I numeri segreti della fiamma", "4": "Solidi, liquidi e gas", "5": "Il calore e le scintille", "6": "Le pozioni che spengono", "7": "La vita di un incendio", "8": "Gli scudi del villaggio", "9": "Le rune", "10": "I guardiani dei presidi", "11": "Le terre maledette", "12": "Pelle e corazza", "13": "I muri incantati", "14": "Il sentiero fuori dal bosco", "15": "Le misure del sentiero", "16": "Campane e camini", "17": "Il primo strumento: l'estintore", "18": "Fontane e piogge magiche", "19": "Aprire la strada ai cavalieri", "20": "Il patto del villaggio", "21": "Le maschere"};
const L="ABC";
const GR="../",GT={"1": "Il sigillo del fuoco", "2": "Le cinque creature del fuoco", "3": "I numeri segreti della fiamma", "4": "Solidi, liquidi e gas", "5": "Il calore e le scintille", "6": "Le pozioni che spengono", "7": "La vita di un incendio", "8": "Gli scudi del villaggio", "9": "Le rune", "10": "I guardiani dei presidi", "11": "Le terre maledette", "12": "Pelle e corazza", "13": "I muri incantati", "14": "Il sentiero fuori dal bosco", "15": "Le misure del sentiero", "16": "Campane e camini", "17": "Il primo strumento: l'estintore", "18": "Fontane e piogge magiche", "19": "Aprire la strada ai cavalieri", "20": "Il patto del villaggio", "21": "Le maschere", "22": "Il rituale", "23": "Il ripasso della strega"};
let Q=[],st={},S=null,timerId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=v=>(v===0?"allo ":v===1||v===8||v===11||(v>=80&&v<=89)?"all'":"al ")+v+"%";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const load=()=>{try{st=JSON.parse(localStorage.getItem("qa3for_grimorio")||"{}")}catch(e){st={}}};
const save=()=>{try{localStorage.setItem("qa3for_grimorio",JSON.stringify(st))}catch(e){}};
const mark=(n,ok)=>{const r=st[n]||{r:0,w:0};ok?r.r++:r.w++;r.l=ok?1:0;st[n]=r;save()};
const errs=()=>Q.filter(q=>st[q.n]&&st[q.n].l===0);
const SK="qa3for_sess",HY="qa3for_homey",QN=8;
function pickBombeiro(){
  // tutte Facili; se non bastano Medie, poi Difficili; ultimo ripiego le Nuove
  const G={easy:[],mid:[],hard:[],new:[]};Q.forEach(q=>G[level(q.n)[0]].push(q));
  const out=[];for(const k of ["easy","mid","hard","new"]){const g=shuffle(G[k]);while(out.length<QN&&g.length)out.push(g.pop())}
  return shuffle(out);
}
function pickChapter(c){
  const pool=Q.filter(q=>q.c===c),size=Math.min(QN,pool.length),G={new:[],easy:[],mid:[],hard:[]};
  pool.forEach(q=>G[level(q.n)[0]].push(q));
  for(const k in G)G[k]=shuffle(G[k]);
  if(G.new.length===pool.length)return G.new.slice(0,size);
  const nN=Math.min(6,G.new.length),r=size-nN;
  // ripasso: 1/2 Medie, 1/4 Facili, 1/4 Difficili; resti al piu' grande, pareggi alla Facile
  const ex={mid:r/2,easy:r/4,hard:r/4},w={mid:Math.floor(ex.mid),easy:Math.floor(ex.easy),hard:Math.floor(ex.hard)};
  let left=r-w.mid-w.easy-w.hard;
  const ord=["easy","hard","mid"].sort((a,b)=>(ex[b]-Math.floor(ex[b]))-(ex[a]-Math.floor(ex[a])));
  for(const k of ord){if(left<=0)break;w[k]++;left--}
  const av={mid:G.mid.length,easy:G.easy.length,hard:G.hard.length},spare=k=>Math.max(0,av[k]-w[k]);
  // gruppo vuoto: i posti vanno al vicino (M divide tra F e D, F -> M poi D, D -> M poi F)
  let d=Math.max(0,w.mid-av.mid);w.mid-=d;w.easy+=Math.ceil(d/2);w.hard+=Math.floor(d/2);
  d=Math.max(0,w.easy-av.easy);w.easy-=d;let m=Math.min(d,spare("mid"));w.mid+=m;w.hard+=d-m;
  d=Math.max(0,w.hard-av.hard);w.hard-=d;m=Math.min(d,spare("mid"));w.mid+=m;d-=m;m=Math.min(d,spare("easy"));w.easy+=m;d-=m;
  const out=[...G.new.slice(0,nN),...G.mid.slice(0,w.mid),...G.easy.slice(0,w.easy),...G.hard.slice(0,w.hard)];
  // casi limite: se mancano domande gia' viste, i posti vanno alle Nuove
  if(out.length<size)out.push(...G.new.slice(nN,nN+size-out.length));
  return shuffle(out);
}
const level=n=>{const r=st[n];if(!r||!(r.r+r.w))return["new","Nuova"];const x=r.r/(r.r+r.w);return x>2/3?["easy","Facile"]:x>1/2?["mid","Media"]:["hard","Difficile"]};
const pack=o=>({list:o.list.map(q=>q.n),mode:o.mode,title:o.title,chap:o.chap,i:o.i||0,ans:o.ans,done:o.done||{},end:o.end||0,lab:o.lab||{}});
const unpack=o=>{const m={};Q.forEach(q=>m[q.n]=q);const list=o.list.map(n=>m[n]);if(list.some(q=>!q))return null;return {...o,list}};
const persist=()=>{try{if(S&&S.list)localStorage.setItem(SK,JSON.stringify({ph:"q",s:pack(S)}));else if(S&&S.again)localStorage.setItem(SK,JSON.stringify({ph:"r",s:pack(S.again)}));else localStorage.removeItem(SK)}catch(e){}};
function enterQuiz(mode){
  $("back").href=GR;$("back").hidden=mode==="exam";$("tmr").hidden=mode!=="exam";
  $("home").style.display="none";$("quiz").style.display="block";document.body.classList.add("inquiz");
  clearInterval(timerId);if(mode==="exam")timerId=setInterval(tick,1000);
}

function home(){
  clearInterval(timerId);S=null;document.body.classList.remove("inquiz");$("back").href=GR;$("back").hidden=false;$("tmr").hidden=true;
  $("quiz").style.display="none";$("home").style.display="block";
  const seen=Q.filter(q=>st[q.n]).length,ok=Q.filter(q=>st[q.n]&&st[q.n].l===1).length;
  const ko=seen-ok;$("stats").innerHTML=`<span class="bar"><i class="ok" style="width:${ok/Q.length*100}%"></i><i class="ko" style="width:${ko/Q.length*100}%"></i></span><small>${Q.length} domande${seen?` · ${ok} ${ok===1?"giusta":"giuste"}, ${ko} da ripassare`:""}</small>`;
  const e=errs().length;$("bErr").disabled=!e;
  persist();
  $("chaps").innerHTML=Object.keys(CH).map(c=>{const qs=Q.filter(q=>q.c==c),g=qs.filter(q=>st[q.n]&&st[q.n].l===1).length,b=qs.filter(q=>st[q.n]&&st[q.n].l===0).length;
    return `<button class="chap" data-c="${c}"><span class="num">${c}</span><span class="nm">${CH[c]}</span><span><span class="bar"><i class="ok" style="width:${g/qs.length*100}%"></i><i class="ko" style="width:${b/qs.length*100}%"></i></span><small>${qs.length} domande${g||b?` · ${g} ${g===1?"giusta":"giuste"}, ${b} da ripassare`:""}</small></span></button>`}).join("");
}

function start(list,mode,title,chap){
  S={list,mode,title,chap,i:0,ans:{},done:{},end:mode==="exam"?Date.now()+30*60e3:0};
  enterQuiz(mode);render();window.scrollTo({top:0});
}
function tick(){
  const left=Math.max(0,S.end-Date.now()),el=$("tmr");
  if(el){const m=Math.floor(left/60e3),s=Math.floor(left/1e3)%60;el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<5*60e3)}
  if(!left)finish();
}
function render(){
  const q=S.list[S.i],n=S.list.length,ex=S.mode==="exam",a=S.ans[S.i],shown=!ex&&S.done[S.i];
  S.lab=S.lab||{};if(!S.lab[S.i])S.lab[S.i]=level(q.n);const lv=S.lab[S.i];
  let o=q.o.map((t,k)=>{let c="opt";if(shown){if(k===q.a)c+=" right";else if(k===a)c+=" wrong"}else if(k===a)c+=" sel";
    return `<button class="${c}" data-k="${k}" ${shown?"disabled":""}><span class="l">${L[k]}</span><span>${esc(t)}</span></button>`}).join("");
  let fb="";if(shown){const ok=a===q.a;fb=`<div class="fb show ${ok?"good":"bad"}"><b>${ok?"Giusto!":"Sbagliato: la risposta corretta è la "+L[q.a]}</b>${q.t?`<p class="tip">${esc(q.t)}</p>`:""}</div>`}
  const last=S.i===n-1;
  $("quiz").innerHTML=`<div class="qhead"><span class="ttl">${esc(S.title)}</span><span class="pill">${S.i+1} di ${n}</span></div>
  <div class="prog"><i style="width:${(ex?Object.keys(S.ans).length:Object.keys(S.done).length)/n*100}%"></i></div>
  <article class="qcard"><div class="qn"><span>#${q.n} · Capitolo ${q.c}</span>${ex?"":`<span class="lvl ${lv[0]}">${lv[1]}</span>`}</div><p class="qt">${esc(q.q)}</p>${q.i?`<img class="qimg" src="${q.i}" alt="Cartello della domanda ${q.n}">`:""}<div class="opts">${o}</div>${fb}</article>
  <div class="nav qnav">${ex&&S.confirm?`<button class="btn yes" id="bYes">Sì</button><b class="ask">Sicura?</b><button class="btn ghost" id="bNo">No</button>`:(ex?`<button class="btn ghost" id="bPrev" ${S.i?"":"disabled hidden-slot"}>&lsaquo; Precedente</button><button class="btn" id="bEnd">Consegna</button><button class="btn ghost" id="bNext" ${last?"disabled hidden-slot":""}>Successiva &rsaquo;</button>`:`<button class="btn ghost" id="bHome"><svg class="xi" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Chiudi</button><button class="btn" id="bNext" ${shown?"":"disabled hidden-slot"}>${last?"Vedi il risultato":"Successiva"} &rsaquo;</button>`)}</div>
  ${ex?`<div class="dots">${S.list.map((_,k)=>`<button class="dot ${S.ans[k]!==undefined?"done":""} ${k===S.i?"cur":""}" data-j="${k}">${k+1}</button>`).join("")}</div>`:""}`;
  persist();
  if(ex)tick();
}
function choose(k){
  S.confirm=0;
  if(S.mode==="exam"){S.ans[S.i]=k;render();return}
  if(S.done[S.i])return;
  S.ans[S.i]=k;S.done[S.i]=1;mark(S.list[S.i].n,k===S.list[S.i].a);render();
}
function next(){S.confirm=0;if(S.mode!=="exam"&&!S.done[S.i])return;if(S.i<S.list.length-1){S.i++;render()}else finish()}
function finish(){
  clearInterval(timerId);
  if(S.mode==="exam")S.list.forEach((q,k)=>{if(S.ans[k]!==undefined)mark(q.n,S.ans[k]===q.a)});
  const Rr={list:S.list,mode:S.mode,title:S.title,chap:S.chap,ans:S.ans};S={again:Rr};persist();
  showRes(Rr);window.scrollTo({top:$("quiz").offsetTop-20});
  const ok=Rr.list.filter((q,k)=>Rr.ans[k]===q.a).length,n=Rr.list.length,pass=Rr.mode==="exam"?ok>=10:ok/n>=2/3;
  if(pass)party(ok===n);
}
const FX={leaf:c=>`<svg viewBox="0 0 20 12"><path d="M1 6C5 0 15 0 19 6 15 12 5 12 1 6z" fill="${c}"/><path d="M3 6h14" stroke="#0003" stroke-width="1"/></svg>`,
 flower:c=>`<svg viewBox="0 0 20 20"><g fill="${c}"><circle cx="10" cy="4.6" r="4"/><circle cx="15.1" cy="8.3" r="4"/><circle cx="13.2" cy="14.4" r="4"/><circle cx="6.8" cy="14.4" r="4"/><circle cx="4.9" cy="8.3" r="4"/></g><circle cx="10" cy="10" r="3" fill="#f2c94c"/></svg>`,
 star:c=>`<svg viewBox="0 0 20 20"><path d="M10 0l2.6 7.4L20 10l-7.4 2.6L10 20l-2.6-7.4L0 10l7.4-2.6z" fill="${c}"/></svg>`};
function party(big){
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches,box=document.querySelector(".score"),src=document.querySelector(".frogh");
  if(box&&src){const f=src.cloneNode(true);f.setAttribute("class","pfrog"+(big?" big":"")+(rm?" still":""));f.removeAttribute("style");box.appendChild(f)}
  if(rm)return;
  const lay=document.createElement("div");lay.className="party";lay.setAttribute("aria-hidden","true");document.body.appendChild(lay);
  const cols=["#4d6a35","#93b56e","#b8741a","#f2b54f","#b0676e","#e4a4aa","#7e6fa8"],kinds=big?["leaf","flower","star","leaf"]:["leaf"],n=big?70:12;
  for(let i=0;i<n;i++){const k=kinds[i%kinds.length],sz=(k==="leaf"?20:14)+Math.random()*12,el=document.createElement("i");
    el.innerHTML=FX[k](cols[Math.random()*cols.length|0]);
    el.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${sz|0}px;height:${sz|0}px;animation-duration:${((big?2.3:1.4)+Math.random()*1.3).toFixed(2)}s;animation-delay:${(Math.random()*(big?1.3:.4)).toFixed(2)}s;--dx:${(Math.random()*140-70)|0}px;--r:${(Math.random()*720-360)|0}deg`;
    lay.appendChild(el)}
  setTimeout(()=>lay.remove(),big?5500:3400);
}
function showRes(S){
  clearInterval(timerId);
  const ex=S.mode==="exam",n=S.list.length;
  const ok=S.list.filter((q,k)=>S.ans[k]===q.a).length,pass=ex?ok>=10:ok/n>=2/3,e=n-ok,maxE=n-Math.ceil(n*2/3-1e-9),quasi=!ex&&!pass&&e===maxE+1,err=k=>`${k} ${k===1?"errore":"errori"}`;
  const rows=S.list.map((q,k)=>{const a=S.ans[k],g=a===q.a;return {g,h:`<div class="rv ${g?"good":"bad"}"><div class="rvn">#${q.n}</div><div class="q">${esc(q.q)}</div><div class="a">${g?`<em>${L[q.a]}. ${esc(q.o[q.a])}</em>`:`${a===undefined?"Nessuna risposta":`<s>${L[a]}. ${esc(q.o[a])}</s>`}<br><em>Giusta: ${L[q.a]}. ${esc(q.o[q.a])}</em>${q.t?`<br>${esc(q.t)}`:""}`}</div></div>`}});
  const shownRows=(ex?rows:rows.filter(r=>!r.g)).map(r=>r.h).join("");
  $("quiz").innerHTML=`<div class="res"><div class="score ${pass?"pass":quasi?"mid":"fail"}"><span class="big">${ok}/${n}</span><div><h2>${ex?(pass?"Scritto superato!":"Scritto non superato"):e===0?"Perfetto!":(pass?"Ottimo lavoro!":"Ancora un po' di ripasso")}</h2><p style="margin:6px 0 0">${e===0?(ex?"Perfetto! 0 errori!":"0 errori!"):pass?`Hai fatto solo ${err(e)}!`:(ex&&e===6)||quasi?`Hai fatto ${err(e)}, ci sei quasi!`:`Hai fatto ${err(e)}.`}</p></div></div>
  <div class="nav rnav"><button class="btn ghost" id="bHome"><svg class="xi" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Chiudi</button><button class="btn" id="bAgain"><svg class="ri" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8.6A5.3 5.3 0 1 1 11.6 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12.4 1.4v3.4H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>${ex?"Nuova simulazione":"Nuovo quiz"}</button></div>
  ${S.chap&&!pass?`<a class="rip" href="${GR}#c${S.chap}">&lsaquo; Ripassa il capitolo ${S.chap} nel Grimorio</a>`:""}
  <h2 style="font-size:26px;margin-bottom:12px">${ex?"Le tue risposte":"Le domande sbagliate"}</h2>${shownRows||'<p class="empty">Nessun errore. Complimenti!</p>'}</div>`;
  $("back").hidden=false;$("tmr").hidden=true;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("chap")){const c=+t.dataset.c;start(pickChapter(c),"chap",`Capitolo ${c}: ${CH[c]}`,c);return}
  if(t.classList.contains("opt")){choose(+t.dataset.k);return}
  if(t.classList.contains("dot")){S.confirm=0;S.i=+t.dataset.j;render();return}
  switch(t.id){
    case"bExam":start(shuffle(Q).slice(0,15),"exam","Simulazione d'esame");break;
    case"bErr":start(shuffle(errs()).slice(0,QN),"err","Ripasso degli errori");break;
    case"bAll":start(pickBombeiro(),"all","Modalità bombeiro");break;
    case"bExit":case"bHome":if(location.hash)try{history.replaceState(null,"",location.pathname)}catch(e){}home();break;
    case"bPrev":if(S.i){S.confirm=0;S.i--;render()}break;
    case"bNext":next();break;
    case"bEnd":S.confirm=1;render();break;
    case"bYes":finish();break;
    case"bNo":S.confirm=0;render();break;
    case"bAgain":{const p=S.again;if(p.mode==="err"&&!errs().length){home();break}start(p.mode==="exam"?shuffle(Q).slice(0,15):p.mode==="chap"?pickChapter(p.chap):p.mode==="err"?shuffle(errs()).slice(0,QN):pickBombeiro(),p.mode,p.title,p.chap);break}
    case"bReset":if(t.dataset.sure){st={};save();$("bResetT").textContent="Cancella tutti i dati";delete t.dataset.sure;home()}else{t.dataset.sure=1;$("bResetT").textContent="Sicura di voler uccidere questa ranetta?"}break;
  }
});
document.addEventListener("keydown",e=>{
  if(!S||!S.list||$("quiz").style.display==="none")return;
  const k={"1":0,"2":1,"3":2,a:0,b:1,c:2}[e.key.toLowerCase()];
  if(k!==undefined){choose(k);e.preventDefault()}
  else if(e.key==="Enter"){S.mode==="exam"?(S.i<S.list.length-1&&(S.i++,render())):next()}
});
load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const fromHash=()=>{let m=/^#g-(\d+)$/.exec(location.hash),g=m&&+m[1];if(g&&GT[g]){if(Q.some(q=>q.c===g)){start(pickChapter(g),"chap",`Capitolo ${g}: ${GT[g]}`,g);return true}}m=/^#cap-(\d+)$/.exec(location.hash);const c=m&&+m[1];if(c&&CH[c]){start(pickChapter(c),"chap",`Capitolo ${c}: ${CH[c]}`,c);return true}return false};
window.addEventListener("hashchange",()=>{if(Q.length)fromHash()});
const restore=raw=>{let o;try{o=JSON.parse(raw||"null")}catch(e){}if(!o||!o.s)return false;const x=unpack(o.s);if(!x)return false;
  if(o.ph==="r"){S={again:x};enterQuiz("res");$("back").hidden=false;showRes(x);return true}
  S=x;enterQuiz(x.mode);if(x.mode==="exam"&&Date.now()>=x.end){finish();return true}render();return true};
let hyT;addEventListener("scroll",()=>{if(S)return;clearTimeout(hyT);hyT=setTimeout(()=>{try{localStorage.setItem(HY,String(Math.round(scrollY)))}catch(e){}},250)},{passive:true});
let rawSess=null;try{rawSess=localStorage.getItem(SK)}catch(e){}
fetch("domande.json").then(r=>r.json()).then(d=>{Q=d;home();
  if(fromHash()){try{history.replaceState(null,"",location.pathname)}catch(e){}return}
  if(!restore(rawSess)){const y=+(localStorage.getItem(HY)||0);if(y){const r=document.documentElement;r.style.scrollBehavior="auto";scrollTo(0,y);r.style.scrollBehavior=""}}}).catch(()=>{$("stats").textContent="Non sono riuscito a caricare le domande. Ricarica la pagina."});
}
</script>
